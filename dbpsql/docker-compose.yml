version: '3.4'

# Paths are relative to this folder: src/dwhclients/newadwh/dbmssql
# App images expect Release publish output under images/<service>/publish
# Prepare them:  .\build-images.ps1

x-host-mssql:
  &host-mssql
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-common:
  &common
  build:
    context: ./images
    dockerfile: airflow/Dockerfile
  user: "${AIRFLOW_UID}:0"
  env_file:
    - .env
  environment:
    # Airflow 3 SimpleAuth (FAB _AIRFLOW_WWW_USER_* ignored). Login: airflow/airflow
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin,admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json
    # LocalExecutor workers must call Execution API in api-server container (not localhost)
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://api-server:8080/execution/
    # Must be identical on scheduler + api-server; >=64 bytes for HS512
    AIRFLOW__API_AUTH__JWT_SECRET: NevaDWH-local-dev-jwt-secret-key-must-be-at-least-64-bytes-long!!!!
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__API__SECRET_KEY: NevaDWH-local-dev-api-secret-key-must-be-at-least-64-bytes-long!!!!
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./ETLAirflow/dags:/opt/airflow/dags
    - ./logs/ETLAirflow:/opt/airflow/logs
    - ./ETLAirflow/plugins:/opt/airflow/plugins
    - ./ETLAirflow/config:/opt/airflow/config
    - /var/run/docker.sock:/var/run/docker.sock


x-depends-on:
  &depends-on
  depends_on:
    postgresdb:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  postgresdb:
    image: postgres:17.2-alpine
    container_name: client-postgresdb17
    command:
      - "postgres"
      - "-c"
      - "max_connections=500"
      - "-c"
      - "shared_buffers=1GB" 
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 10s
      retries: 120
    restart: unless-stopped
    ports:
      - '54321:5432'
    volumes:
      - postgres-clientdata:/var/lib/postgresql
      - ./005_create_db.sql:/docker-entrypoint-initdb.d/005_create_db.sql
      - ./010_create_ods.sql:/docker-entrypoint-initdb.d/010_create_ods.sql
      - ./020_dictionaries_ods.sql:/docker-entrypoint-initdb.d/020_dictionaries_ods.sql
      - ./030_create_dwh.sql:/docker-entrypoint-initdb.d/030_create_dwh.sql
      - ./040_dictionaries_dwh.sql:/docker-entrypoint-initdb.d/040_dictionaries_dwh.sql
      - ./050_create_landing.sql:/docker-entrypoint-initdb.d/050_create_landing.sql
      - ./060_dictionaries_landing.sql:/docker-entrypoint-initdb.d/060_dictionaries_landing.sql
            
    env_file:
      - .env

  rabbit:
    build:
      context: ./images/Rabbit
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      start_period: 5s
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - '5672:5672'
      - '15672:15672'

  scheduler:
    <<: [*common, *depends-on]
    container_name: airflow-scheduler
    command: scheduler
    restart: on-failure
    ports:
      - "8793:8793"
    depends_on:
      postgresdb:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api-server:
    <<: [*common, *depends-on]
    container_name: airflow-api-server
    restart: always
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  dag-processor:
    <<: [*common, *depends-on]
    container_name: airflow-dag-processor
    restart: on-failure
    command: dag-processor
    depends_on:
      postgresdb:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-init:
    <<: *common
    container_name: airflow-init
    entrypoint: /bin/bash
    user: "0:0"
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/config
        chown -R "${AIRFLOW_UID:-0}:0" /opt/airflow/{logs,dags,plugins,config}
        exec /entrypoint airflow version

  mq.webservice:
    <<: *host-mssql
    image: raulamailru/nevadwh-mq:0.0.2
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      #- ASPNETCORE_HTTPS_PORTS=8081
      - DataBaseSettings__ServerName=postgresdb
      - DataBaseSettings__ServerType=psql
      - DataBaseSettings__NamingStyle=Snake
      - DataBaseSettings__Port=5432
      - DataBaseSettings__SessionMode=${MQ_SESSION_MODE:-FullMode}
      - DataBaseSettings__ClientName=${MQ_CLIENTNAME:-client1}
      - DataBaseSettings__DataBase=${MQ_DATABASE:-client1_ods}
      - DataBaseSettings__User=${MQ_USER:-postgres}
      - DataBaseSettings__Password=${MQ_PASSWORD:-postgres}
      - RabbitMQSettings__Host=rabbit
      - RabbitMQSettings__Port=5672
      - RabbitMQSettings__VirtualHost=${RABBITMQ_VIRTUAL_HOST:-/}
      - RabbitMQSettings__Exchange=${RABBITMQ_EXCHANGE:-amq.fanout}
      - RabbitMQSettings__UserName=${RABBITMQ_USER:-admin}
      - RabbitMQSettings__UserPassword=${RABBITMQ_PASSWORD:-admin}
      - RabbitMQSettings__DefaultQueue=${RABBITMQ_DEFAULT_QUEUE:-InfoBase}
    ports:
      - "8090:8080"
      - "8091:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ./logs:/logs
    depends_on:
      postgresdb:
        condition: service_healthy
      rabbit:
        condition: service_healthy

  landing.webservice:
    <<: *host-mssql
    image: raulamailru/nevadwh-landing:0.0.2
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - DataBaseSettings__ServerName=postgresdb
      - DataBaseSettings__ServerType=psql
      - DataBaseSettings__NamingStyle=Snake
      - DataBaseSettings__ClientName=${MQ_CLIENTNAME:-client1}
      - DataBaseSettings__DataBase=${LANDING_DATABASE:-client1_landing}
      - DataBaseSettings__User=${LANDING_USER:-postgres}
      - DataBaseSettings__Password=${LANDING_PASSWORD:-postgres}
    ports:
      - "8092:8080"
      - "8093:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ./logs:/logs
    depends_on:
      postgresdb:
        condition: service_healthy
      rabbit:
        condition: service_healthy

  generator.api:
    <<: *host-mssql
    image: raulamailru/nevadwh-generator:0.0.2
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - DataBaseSettings__ServerName=host.docker.internal
      - DataBaseSettings__ServerType=mssql
      - DataBaseSettings__ClientName=${MQ_CLIENTNAME:-client1}
      - DataBaseSettings__DataBase=${MQ_DATABASE:-client1_ods}
      - DataBaseSettings__User=${MQ_USER:-postgres}
      - DataBaseSettings__Password=${MQ_PASSWORD:-postgres}
    ports:
      - "8110:8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ./logs:/logs
    depends_on:
      postgresdb:
        condition: service_healthy

  nevadwh:
    image: raulamailru/nevadwh-admin:0.0.2
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgresdb;Port=5432;Database=nevadwh;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - ConnectionStrings__GeneratorConnection=http://generator.api:8080
      - ConnectionStrings__mqWebServiceConnectionString=http://mq.webservice:8080
      - ConnectionStrings__LandingWebServiceConnectionString=http://landing.webservice:8080
    ports:
      - "8100:8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ./logs:/logs
    depends_on:
      postgresdb:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      mq.webservice:
        condition: service_started
      landing.webservice:
        condition: service_started
      generator.api:
        condition: service_started

volumes:
  postgres-clientdata:
