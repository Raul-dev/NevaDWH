version: '3.4'

# Paths are relative to this folder: src/dwhclients/newadwh/dbmssql
# App images expect Release publish output under images/<service>/publish
# Prepare them:  .\build-images.ps1

x-host-mssql:
  &host-mssql
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-common:
  &common
  build:
    context: ./images
    dockerfile: airflow/Dockerfile
  user: "${AIRFLOW_UID}:0"
  env_file:
    - .env
  environment:
    # Airflow 3 SimpleAuth (FAB _AIRFLOW_WWW_USER_* ignored). Login: admin/admin (как RabbitMQ)
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin,admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json
    # LocalExecutor workers must call Execution API in api-server container (not localhost)
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://api-server:8080/execution/
    # Must be identical on scheduler + api-server; >=64 bytes for HS512
    AIRFLOW__API_AUTH__JWT_SECRET: NevaDWH-local-dev-jwt-secret-key-must-be-at-least-64-bytes-long!!!!
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__API__SECRET_KEY: NevaDWH-local-dev-api-secret-key-must-be-at-least-64-bytes-long!!!!
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./ETLAirflow/dags:/opt/airflow/dags
    - ./logs/ETLAirflow:/opt/airflow/logs
    - ./ETLAirflow/plugins:/opt/airflow/plugins
    - ./ETLAirflow/config:/opt/airflow/config
    - /var/run/docker.sock:/var/run/docker.sock


x-depends-on:
  &depends-on
  depends_on:
    postgresdb:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  # Traefik v3, config via command + Docker labels (no traefik.yml / configurations/).
  # http://localhost/              NevaDWH admin
  # http://localhost/v1/xdto       generator.api (PathBase)
  # http://localhost:8090/v1/mq    mq.webservice (первый ODS); доп. ODS → localhost:8092, 8094, … тот же /v1/mq
  # http://localhost/v1/mq         Traefik → первый MQ; доп. → Host mq-{sourceKey}.localhost/v1/mq
  # http://localhost:8080          Airflow UI (не за Traefik)
  # http://localhost/rabbit/       RabbitMQ management (path_prefix, без StripPrefix)
  # http://bi.localhost            Metabase BI (отчёты DWH)
  # http://traefik.localhost       Traefik dashboard
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.service=api@internal"

  postgresdb:
    image: postgres:17.2-alpine
    container_name: client-postgresdb17
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 10s
      retries: 120
    restart: unless-stopped
    ports:
      - '54321:5432'
    volumes:
      - postgres-clientdata:/var/lib/postgresql
      - ./005_create_db.sql:/docker-entrypoint-initdb.d/005_create_db.sql
      - ./008_metabase.sql:/docker-entrypoint-initdb.d/008_metabase.sql
 
    env_file:
      - .env

  rabbit:
    build:
      context: ./images/Rabbit
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      start_period: 5s
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      # Always apply path_prefix from the repo file (cached images omit it → Object Not Found).
      - ./images/Rabbit/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./images/Rabbit/definitions.json:/etc/rabbitmq/definitions.json:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.rabbit-slash.redirectregex.regex=^https?://[^/]+/rabbit$$"
      - "traefik.http.middlewares.rabbit-slash.redirectregex.replacement=/rabbit/"
      - "traefik.http.routers.rabbit-slash.rule=Path(`/rabbit`)"
      - "traefik.http.routers.rabbit-slash.entrypoints=web"
      - "traefik.http.routers.rabbit-slash.middlewares=rabbit-slash"
      - "traefik.http.routers.rabbit-slash.priority=110"
      - "traefik.http.routers.rabbit-slash.service=rabbit"
      - "traefik.http.routers.rabbit.rule=PathPrefix(`/rabbit`)"
      - "traefik.http.routers.rabbit.entrypoints=web"
      - "traefik.http.routers.rabbit.priority=100"
      - "traefik.http.services.rabbit.loadbalancer.server.port=15672"

  scheduler:
    <<: [*common, *depends-on]
    container_name: airflow-scheduler
    command: scheduler
    restart: on-failure
    ports:
      - "8793:8793"
    depends_on:
      postgresdb:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api-server:
    <<: [*common, *depends-on]
    container_name: airflow-api-server
    restart: always
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  dag-processor:
    <<: [*common, *depends-on]
    container_name: airflow-dag-processor
    restart: on-failure
    command: dag-processor
    depends_on:
      postgresdb:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-init:
    <<: *common
    container_name: airflow-init
    entrypoint: /bin/bash
    user: "0:0"
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/config
        chown -R "${AIRFLOW_UID:-0}:0" /opt/airflow/{logs,dags,plugins,config}
        exec /entrypoint airflow version
    depends_on:
      postgresdb:
        condition: service_healthy


  mq.webservice:
    <<: *host-mssql
    image: raulamailru/nevadwh-mq:0.0.3
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - DataBaseSettings__ServerName=host.docker.internal
      - DataBaseSettings__ServerType=mssql
      - DataBaseSettings__Port=1433
      - DataBaseSettings__SessionMode=${MQ_SESSION_MODE:-FullMode}
      - DataBaseSettings__ClientName=${MQ_CLIENTNAME:-client1}
      - DataBaseSettings__DataBase=${MQ_DATABASE:-newadwh_ods}
      - DataBaseSettings__User=${MQ_USER:-postgres}
      - DataBaseSettings__Password=${MQ_PASSWORD:-postgres}
      - RabbitMQSettings__Host=rabbit
      - RabbitMQSettings__Port=5672
      - RabbitMQSettings__VirtualHost=${RABBITMQ_VIRTUAL_HOST:-/}
      - RabbitMQSettings__Exchange=${RABBITMQ_EXCHANGE:-amq.fanout}
      - RabbitMQSettings__UserName=${RABBITMQ_USER:-admin}
      - RabbitMQSettings__UserPassword=${RABBITMQ_PASSWORD:-admin}
      - RabbitMQSettings__DefaultQueue=${RABBITMQ_DEFAULT_QUEUE:-InfoBase}
      - RabbitMQSettings__Enabled=${MQ_RABBIT_ENABLED:-true}
    ports:
      - "8090:8080"
      - "8091:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/mq/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.mq.rule=PathPrefix(`/v1/mq`)"

      - "traefik.http.routers.mq.entrypoints=web"
      - "traefik.http.routers.mq.priority=100"
      - "traefik.http.services.mq.loadbalancer.server.port=8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ./logs:/logs
    depends_on:
      postgresdb:
        condition: service_healthy
      rabbit:
        condition: service_started
        required: false


  mq.webservice.landing:
    <<: *host-mssql
    image: raulamailru/nevadwh-mq:0.0.3
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - DataBaseSettings__ServerName=host.docker.internal
      - DataBaseSettings__ServerType=mssql
      - DataBaseSettings__Port=1433
      - DataBaseSettings__SessionMode=${MQ_SESSION_MODE:-FullMode}
      - DataBaseSettings__ClientName=${MQ_CLIENTNAME:-client1}
      - DataBaseSettings__DataBase=${MQ_DATABASE_LANDING:-newadwh_landing}
      - DataBaseSettings__User=${MQ_USER:-postgres}
      - DataBaseSettings__Password=${MQ_PASSWORD:-postgres}
      - RabbitMQSettings__Host=rabbit
      - RabbitMQSettings__Port=5672
      - RabbitMQSettings__VirtualHost=${RABBITMQ_VIRTUAL_HOST:-/}
      - RabbitMQSettings__Exchange=${RABBITMQ_EXCHANGE:-amq.fanout}
      - RabbitMQSettings__UserName=${RABBITMQ_USER:-admin}
      - RabbitMQSettings__UserPassword=${RABBITMQ_PASSWORD:-admin}
      - RabbitMQSettings__DefaultQueue=${RABBITMQ_LANDING_QUEUE:-InfoBase_landing}
      - RabbitMQSettings__Enabled=${MQ_RABBIT_ENABLED:-true}
    ports:
      - "8092:8080"
      - "8093:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/mq/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.mq-landing.rule=Host(`mq-landing.localhost`) && PathPrefix(`/v1/mq`)"

      - "traefik.http.routers.mq-landing.entrypoints=web"
      - "traefik.http.routers.mq-landing.priority=100"
      - "traefik.http.services.mq-landing.loadbalancer.server.port=8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ./logs:/logs
    depends_on:
      postgresdb:
        condition: service_healthy
      rabbit:
        condition: service_started
        required: false


  generator.api:
    <<: *host-mssql
    image: raulamailru/nevadwh-generator:0.0.3
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - DataBaseSettings__ServerName=host.docker.internal
      - DataBaseSettings__ServerType=mssql
      - DataBaseSettings__ClientName=${MQ_CLIENTNAME:-client1}
      - DataBaseSettings__DataBase=${MQ_DATABASE:-ods}
      - DataBaseSettings__User=${MQ_USER:-postgres}
      - DataBaseSettings__Password=${MQ_PASSWORD:-postgres}
    ports:
      - "8110:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.generator.rule=PathPrefix(`/v1/xdto`)"
      - "traefik.http.routers.generator.entrypoints=web"
      - "traefik.http.routers.generator.priority=100"
      - "traefik.http.services.generator.loadbalancer.server.port=8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ./logs:/logs
    depends_on:
      postgresdb:
        condition: service_healthy

  nevadwh:
    image: raulamailru/nevadwh-admin:0.0.3
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgresdb;Port=5432;Database=nevadwh;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - ConnectionStrings__GeneratorConnection=http://generator.api:8080
      - ConnectionStrings__mqWebServiceConnectionString=http://mq.webservice:8080




      - ConnectionStrings__LandingWebServiceConnectionString=http://mq.webservice.landing:8080


      # Browser menu URLs (Traefik public routes). Override via EXTERNAL_* in .env
      - ExternalLinks__Airflow=${EXTERNAL_AIRFLOW_URL:-http://localhost:8080}
      - ExternalLinks__RabbitMQ=${EXTERNAL_RABBITMQ_URL:-http://localhost/rabbit/}
      - ExternalLinks__LandingWebService=
      - ExternalLinks__GeneratorApi=${EXTERNAL_GENERATOR_URL:-http://localhost/v1/xdto/api/swagger}
      - ExternalLinks__Traefik=${EXTERNAL_TRAEFIK_URL:-http://traefik.localhost}
      - ExternalLinks__Metabase=${EXTERNAL_METABASE_URL:-http://bi.localhost}

      - ExternalLinks__MqSources__0__Title=ODS
      - ExternalLinks__MqSources__0__Url=/Ods

      - ExternalLinks__MqSources__1__Title=landing
      - ExternalLinks__MqSources__1__Url=/Landing

      - Metabase__ApiUrl=http://metabase:3000
      - Metabase__PublicBaseUrl=${EXTERNAL_METABASE_URL:-http://bi.localhost}
      - Metabase__AdminEmail=${METABASE_ADMIN_EMAIL:-admin@neva.loc}
      - Metabase__AdminPassword=${METABASE_ADMIN_PASSWORD:-admin}
      - Metabase__DashboardName=${METABASE_DASHBOARD_NAME:-Продажи и товары}
      - Stand__IsDemo=${DEMO_STAND:-false}
      - Localization__DefaultCulture=${NEVADWH_DEFAULT_CULTURE:-ru}
      - SeedAdmin__User=${NEVADWH_ADMIN_USER:-Admin}
      - SeedAdmin__Password=${NEVADWH_ADMIN_PASSWORD:-admin}
      - SeedAdmin__Email=${NEVADWH_ADMIN_EMAIL:-admin@neva.loc}
      - LogProcedures__Enabled=true
      - LogProcedures__ServerName=${LOGPROCEDURES_SQL_SERVER:-host.docker.internal}
      - LogProcedures__Port=${LOGPROCEDURES_SQL_PORT:-1433}
      - LogProcedures__User=${MQ_USER:-newadwhuser}
      - LogProcedures__Password=${MQ_PASSWORD:-MyPassword321}
      - LogProcedures__TrustServerCertificate=true
      - LogProcedures__Layers__0__Key=ods
      - LogProcedures__Layers__0__Title=ODS
      - LogProcedures__Layers__0__Database=${MQ_DATABASE:-newadwh_ods}
      - LogProcedures__Layers__1__Key=landing
      - LogProcedures__Layers__1__Title=Landing
      - LogProcedures__Layers__1__Database=${MQ_DATABASE_LANDING:-newadwh_landing}
      - LogProcedures__Layers__2__Key=dwh
      - LogProcedures__Layers__2__Title=DWH
      - LogProcedures__Layers__2__Database=${DWH_DATABASE:-newadwh_dwh}
      - LogProcedures__Layers__3__Key=log
      - LogProcedures__Layers__3__Title=Log
      - LogProcedures__Layers__3__Database=${LOG_DATABASE:-newadwh_log}
      - SessionLog__Enabled=true
      - SessionLog__ServerType=mssql
      - SessionLog__ServerName=${LOGPROCEDURES_SQL_SERVER:-host.docker.internal}
      - SessionLog__Port=${LOGPROCEDURES_SQL_PORT:-1433}
      - SessionLog__User=${MQ_USER:-newadwhuser}
      - SessionLog__Password=${MQ_PASSWORD:-MyPassword321}
      - SessionLog__TrustServerCertificate=true
      - SessionLog__Layers__0__Key=ods
      - SessionLog__Layers__0__Title=ODS
      - SessionLog__Layers__0__Database=${MQ_DATABASE:-newadwh_ods}
      - SessionLog__Layers__1__Key=landing
      - SessionLog__Layers__1__Title=Landing
      - SessionLog__Layers__1__Database=${MQ_DATABASE_LANDING:-newadwh_landing}
      - SessionLog__Layers__2__Key=dwh
      - SessionLog__Layers__2__Title=DWH
      - SessionLog__Layers__2__Database=${DWH_DATABASE:-newadwh_dwh}
    ports:
      - "8100:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nevadwh.rule=PathPrefix(`/`)"
      - "traefik.http.routers.nevadwh.entrypoints=web"
      - "traefik.http.routers.nevadwh.priority=1"
      - "traefik.http.services.nevadwh.loadbalancer.server.port=8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ./logs:/logs
    depends_on:
      postgresdb:
        condition: service_healthy
      rabbit:
        condition: service_healthy

      mq.webservice:
        condition: service_started

      mq.webservice.landing:
        condition: service_started

      generator.api:
        condition: service_started

  # BI: отчёты по DWH target.v_rpt_* (MSSQL через host.docker.internal)
  # Login после metabase-init: admin@neva.loc / admin (как Rabbit admin/admin)
  metabase:
    <<: *host-mssql
    image: metabase/metabase:v0.55.2
    container_name: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-postgres}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-postgres}
      MB_DB_HOST: postgresdb
      MB_SITE_URL: ${EXTERNAL_METABASE_URL:-http://bi.localhost}
      MB_SITE_LOCALE: ru
      JAVA_TIMEZONE: Europe/Moscow
      MB_ENABLE_PUBLIC_SHARING: "true"
      MB_PASSWORD_COMPLEXITY: weak
      MB_PASSWORD_LENGTH: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metabase.rule=Host(`bi.localhost`)"
      - "traefik.http.routers.metabase.entrypoints=web"
      - "traefik.http.services.metabase.loadbalancer.server.port=3000"
    depends_on:
      postgresdb:
        condition: service_healthy

  metabase-init:
    image: python:3.12-alpine
    container_name: metabase-init
    restart: "no"
    volumes:
      - ./images/metabase/setup.py:/setup.py:ro
    environment:
      MB_URL: http://metabase:3000
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:-admin@neva.loc}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:-admin}
      METABASE_SITE_NAME: ${METABASE_SITE_NAME:-NevaDWH}
      METABASE_SITE_LOCALE: ru
      METABASE_DWH_ENGINE: sqlserver
      METABASE_DWH_NAME: DWH
      METABASE_DWH_HOST: host.docker.internal
      METABASE_DWH_PORT: 1433
      METABASE_DWH_DB: ${DWH_DATABASE:-dwh}
      METABASE_DWH_USER: ${MQ_USER:-NevaDWH-DEMOuser}
      METABASE_DWH_PASSWORD: ${MQ_PASSWORD:-MyPassword321}
      # true → create v_rpt_* dashboards; false/omit → admin+DWH only
      METABASE_DEMO: ${METABASE_DEMO:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "/setup.py"]
    depends_on:
      metabase:
        condition: service_healthy

volumes:
  postgres-clientdata:
